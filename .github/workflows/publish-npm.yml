name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check package
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public

      - name: Wait for registry propagation
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          for attempt in $(seq 1 40); do
            if [[ "$(npm view "${package_name}@${package_version}" version --prefer-online 2>/dev/null)" == "${package_version}" ]]; then
              echo "${package_name}@${package_version} is available from npm."
              exit 0
            fi

            echo "Waiting for npm registry propagation (${attempt}/40)..."
            sleep 15
          done

          echo "::error::${package_name}@${package_version} was not available after 10 minutes."
          exit 1
